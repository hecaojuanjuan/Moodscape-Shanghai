<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moodscape Shanghai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <section class="profile-gate" id="profileGate" aria-labelledby="profileGateTitle">
      <div class="profile-gate-card">
        <p class="eyebrow">偏好画像</p>
        <h1 id="profileGateTitle">先认识一下你的城市偏好</h1>
        <p class="hero-copy" id="profileGateCopy">回答几个小问题，让路线更像是为你挑的。</p>

        <div class="saved-profile-actions is-hidden" id="savedProfileActions">
          <button type="button" class="primary-button" id="useSavedProfileButton">沿用上次画像进入</button>
          <button type="button" class="secondary-button" id="restartProfileButton">重新作答</button>
        </div>

        <div class="profile-wizard" id="profileWizard">
          <p class="profile-progress" id="profileProgress">1 / 5</p>
          <h2 id="profileQuestionTitle"></h2>
          <div class="profile-option-list" id="profileOptionList"></div>
          <p class="status-text" id="profileStepHint" aria-live="polite"></p>
          <div class="profile-actions">
            <button type="button" class="secondary-button" id="profileBackButton">上一题</button>
            <button type="button" class="secondary-button" id="profileSkipButton">跳过</button>
            <button type="button" class="primary-button" id="profileNextButton">下一题</button>
          </div>
        </div>
      </div>
    </section>

    <main class="app-shell is-hidden" id="appShell">
      <section class="hero" aria-labelledby="pageTitle">
        <p class="eyebrow">AI 城市体验原型</p>
        <h1 id="pageTitle">Moodscape Shanghai</h1>
        <p class="hero-copy">把今天的心情交给上海，生成一条适合此刻节奏的城市路线。</p>
      </section>

      <section class="workspace" aria-label="情绪路线生成区">
        <form class="control-panel" id="recommendForm">
          <div class="field-group">
            <h2>体验标签</h2>
            <div class="tag-grid" id="tagGrid" aria-live="polite">
              <p class="empty-state">正在读取 Excel 体验标签...</p>
            </div>
          </div>

          <div class="field-group">
            <h2>心境标签</h2>
            <div class="tag-grid mindset-grid" id="mindsetGrid" aria-live="polite">
              <p class="empty-state">正在计算心境标签...</p>
            </div>
          </div>

          <div class="field-group profile-summary">
            <div>
              <h2>偏好画像</h2>
              <p id="profileSummaryText">已建立画像</p>
            </div>
            <button type="button" class="secondary-button" id="editProfileButton">修改画像</button>
          </div>

          <label class="field-group" for="userText">
            <span class="field-label">心情描述</span>
            <textarea id="userText" rows="5" placeholder="例如：我今天有点累，想一个人慢慢走"></textarea>
          </label>

          <button type="submit" class="primary-button" id="generateButton">生成路线剧本</button>
          <p class="status-text" id="statusText" aria-live="polite"></p>
        </form>

        <section class="result-panel" aria-labelledby="resultTitle">
          <div class="panel-header">
            <div>
              <p class="eyebrow">推荐结果</p>
              <h2 id="resultTitle">等待生成</h2>
            </div>
            <span id="selectedTagsText">未选择标签</span>
          </div>

          <div class="results" id="results">
            <p class="empty-state">输入心情或选择标签后，这里会展示最适合的一条上海路线。</p>
          </div>
        </section>
      </section>
    </main>

    <script>
      window.MOODSCAPE_CONFIG = {{ frontend_config | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
