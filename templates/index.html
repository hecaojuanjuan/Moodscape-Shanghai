<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moodscape Shanghai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <div>
          <p class="eyebrow">情绪标签个性化旅游推荐</p>
          <h1>Moodscape Shanghai</h1>
          <p class="intro-copy">选择当下的心情，或写下你想要的城市体验，生成一条更贴近情绪的上海路线。</p>
        </div>
      </section>

      <section class="workspace" aria-label="路线推荐工作区">
        <div class="control-panel">
          <div class="field-group">
            <h2>情绪标签</h2>
            <div class="tag-grid" id="tagGrid">
              <button type="button" class="tag-button" data-tag="想一个人静静">想一个人静静</button>
              <button type="button" class="tag-button" data-tag="想慢慢走不赶路">想慢慢走不赶路</button>
              <button type="button" class="tag-button" data-tag="想被夜景治愈">想被夜景治愈</button>
              <button type="button" class="tag-button" data-tag="想认识上海第一面">想认识上海第一面</button>
              <button type="button" class="tag-button" data-tag="想体验未来城市">想体验未来城市</button>
              <button type="button" class="tag-button" data-tag="想被城市震撼">想被城市震撼</button>
              <button type="button" class="tag-button" data-tag="想和TA约会">想和TA约会</button>
              <button type="button" class="tag-button" data-tag="想找回老上海">想找回老上海</button>
              <button type="button" class="tag-button" data-tag="想看展充电">想看展充电</button>
              <button type="button" class="tag-button" data-tag="想探索冷门角落">想探索冷门角落</button>
            </div>
          </div>

          <label class="field-group" for="userText">
            <span class="field-label">心情描述</span>
            <textarea id="userText" rows="5" placeholder="例如：今天想一个人安静地走走，不赶路，也不想花太多钱。"></textarea>
          </label>

          <button type="button" class="primary-button" id="generateButton">生成推荐</button>
          <p class="status-text" id="statusText" aria-live="polite"></p>
        </div>

        <div class="result-panel">
          <div class="panel-header">
            <h2>推荐结果</h2>
            <span id="selectedTagsText">尚未选择标签</span>
          </div>
          <div class="results" id="results">
            <p class="empty-state">选择标签或输入心情后，推荐路线会显示在这里。</p>
          </div>
        </div>
      </section>

      <section class="map-section" aria-label="地图预留区域">
        <div class="map-placeholder">
          <div class="map-line"></div>
          <div class="map-pin pin-one"></div>
          <div class="map-pin pin-two"></div>
          <div class="map-pin pin-three"></div>
          <div class="map-copy">
            <h2>地图路线展示</h2>
            <p>后续会在这里接入地图服务，展示路线点位和连线。</p>
          </div>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
