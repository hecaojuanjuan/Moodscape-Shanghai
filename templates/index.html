<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moodscape Shanghai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="pageTitle">
        <p class="eyebrow">AI 城市体验原型</p>
        <h1 id="pageTitle">Moodscape Shanghai</h1>
        <p class="hero-copy">把今天的心情交给上海，生成一条适合此刻节奏的城市路线。</p>
      </section>

      <section class="workspace" aria-label="情绪路线生成区">
        <form class="control-panel" id="recommendForm">
          <div class="field-group">
            <h2>情绪标签</h2>
            <div class="tag-grid" id="tagGrid">
              <button type="button" class="tag-button" data-tag="独处">独处</button>
              <button type="button" class="tag-button" data-tag="治愈">治愈</button>
              <button type="button" class="tag-button" data-tag="慢走">慢走</button>
              <button type="button" class="tag-button" data-tag="低预算">低预算</button>
              <button type="button" class="tag-button" data-tag="夜景">夜景</button>
              <button type="button" class="tag-button" data-tag="拍照">拍照</button>
              <button type="button" class="tag-button" data-tag="未来感">未来感</button>
              <button type="button" class="tag-button" data-tag="约会">约会</button>
              <button type="button" class="tag-button" data-tag="老上海">老上海</button>
              <button type="button" class="tag-button" data-tag="小众">小众</button>
              <button type="button" class="tag-button" data-tag="艺术">艺术</button>
              <button type="button" class="tag-button" data-tag="展览">展览</button>
            </div>
          </div>

          <label class="field-group" for="userText">
            <span class="field-label">心情描述</span>
            <textarea id="userText" rows="5" placeholder="例如：我今天有点累，想一个人慢慢走"></textarea>
          </label>

          <button type="submit" class="primary-button" id="generateButton">生成路线剧本</button>
          <p class="status-text" id="statusText" aria-live="polite"></p>
        </form>

        <section class="result-panel" aria-labelledby="resultTitle">
          <div class="panel-header">
            <div>
              <p class="eyebrow">推荐结果</p>
              <h2 id="resultTitle">等待生成</h2>
            </div>
            <span id="selectedTagsText">未选择标签</span>
          </div>

          <div class="results" id="results">
            <p class="empty-state">输入心情或选择标签后，这里会展示最适合的一条上海路线。</p>
          </div>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
